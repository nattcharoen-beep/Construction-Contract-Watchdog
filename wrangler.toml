name = "construction-contract-watchdog"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "watchdog-db"
database_id = "(placeholder-db-id)"

[triggers]
crons = ["0 0 * * *"]
